# Deck Video Player - base mpv configuration.
#
# Users should not edit this file; put overrides in
# ~/.config/deckvideoplayer/mpv.conf (loaded after this one by the launcher)
# and app settings in ~/.config/deckvideoplayer/config.ini.

###########################################################################
# Window / app behaviour
###########################################################################
idle=yes
force-window=immediate
fullscreen=yes
keep-open=no
title=Deck Video Player
x11-name=deckvideoplayer
wayland-app-id=io.github.nicocarbone.DeckVideoPlayer
cursor-autohide=always
stop-screensaver=yes
osd-bar=no
osd-level=1
osd-playing-msg=
# Our Lua UI replaces the default controls and key bindings.
osc=no
input-builtin-bindings=no
input-default-bindings=yes
# input-gamepad is enabled by the launcher when this mpv build has SDL2 gamepad support.
input-ar-delay=280
input-ar-rate=18
load-console=no
load-select=no
load-context-menu=no
load-positioning=no
load-stats-overlay=yes
ytdl=no
# Resume positions are handled by the app itself (resume.json).
save-position-on-quit=no
resume-playback=no

###########################################################################
# Rendering: Vulkan + libplacebo. Under gamescope the gamescope WSI layer
# exposes HDR10 swapchains, and target-colorspace-hint makes mpv output HDR
# content as real HDR (and tell gamescope the source's metadata).
###########################################################################
vo=gpu-next
gpu-api=vulkan
target-colorspace-hint=yes
# Tone mapping only kicks in when the output is SDR.
tone-mapping=auto
video-sync=audio
interpolation=no

# Hardware decoding (VA-API on the Deck's AMD APU: H.264, HEVC 8/10-bit,
# VP9, AV1). The actual value is set from config.ini at startup.
hwdec=auto-safe
vd-lavc-dr=yes

###########################################################################
# Audio
###########################################################################
ao=pipewire,pulse,alsa
audio-file-auto=fuzzy
volume-max=130

###########################################################################
# Subtitles
###########################################################################
sub-auto=fuzzy
sub-file-paths=subs:Subs:subtitles:Subtitles
sub-font="Inter"
sub-font-size=44
sub-border-size=2.6
sub-shadow-offset=1
sub-shadow-color="#80000000"
sub-margin-y=36
sub-ass-use-video-data=aspect-ratio
blend-subtitles=no
# Keep white subtitles at SDR reference white on HDR output (not 1000 nits).
sub-hdr-peak=203
image-subs-hdr-peak=203

###########################################################################
# Caching (local media: modest buffers keep memory low)
###########################################################################
cache=auto
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=50MiB

###########################################################################
# Quality profiles, selected from config.ini ([display] quality).
###########################################################################
[dvp-quality-battery]
profile-desc=Lowest GPU load (bilinear scaling, no peak detection)
profile=fast
scale=bilinear
dscale=bilinear
cscale=bilinear

[dvp-quality-balanced]
profile-desc=mpv defaults with cheap downscaling; good on the Deck's 800p screen
dscale=hermite
hdr-compute-peak=no
deband=no

[dvp-quality-high]
profile-desc=High quality scaling for big screens (Steam Machine / TV)
profile=high-quality
