# Deck Video Player configuration
#
# Location: ~/.config/deckvideoplayer/config.ini
# Lines starting with # or ; are comments. Changes apply the next time the
# app is started. Advanced mpv options can go in
# ~/.config/deckvideoplayer/mpv.conf

[library]
# Folders shown in the library. Repeat the line to add more folders.
# "~" is your home folder (/home/deck on a Steam Deck).
folder = ~/Videos
# folder = /run/media/deck/SDCARD/Movies

# Also list removable drives (microSD card, USB disks) as library sources.
removable_media = yes

# Show files and folders whose name starts with a dot.
show_hidden = no

# File extensions treated as videos (comma separated). Leave commented to
# use the built-in list (mkv, mp4, avi, mov, webm, ts, m2ts, ...).
# extensions = mkv,mp4,avi


[playback]
# Preferred languages, in order (ISO 639 codes: eng, spa, jpn, fre, ...).
# Empty = use the file's default tracks.
audio_languages = eng
subtitle_languages = eng

# Subtitle selection:
#   auto   - show subtitles in your language when the audio is in another
#            language (forced subtitles are always shown)
#   always - always show subtitles in your language when available
#   forced - only forced subtitles (signs, foreign dialogue)
#   off    - never enable subtitles automatically
subtitles = auto

# Remember the playback position of each file and offer to resume.
resume = yes

# When a video ends, continue with the next video in the same folder.
autoplay_next = yes

# Seek steps in seconds: D-pad left/right, and L1/R1.
seek_short = 10
seek_long = 60

# Start volume and maximum (above 100 = amplification).
volume = 100
volume_max = 130

# Send compressed audio to an AV receiver (HDMI). Example:
#   audio_passthrough = ac3,eac3,dts-hd,truehd
audio_passthrough =

# Hardware decoding: auto (VA-API, then Vulkan, then safe fallbacks),
# no (software only), or any mpv --hwdec value.
hwdec = auto

# Headphone surround: plays 5.1/7.1 soundtracks as 3D sound on headphones
# (binaural rendering with a measured head model). Stereo sources are not
# changed. Can also be switched in the audio menu (Y) during playback.
# Leave off for speakers and AV receivers; ignored with audio_passthrough.
headphone_surround = no


[display]
# Device profile: auto, deck-oled, deck-lcd or tv (Steam Machine / desktop).
device = auto

# Rendering quality: auto (balanced on Steam Deck, high on other devices),
# battery, balanced or high.
quality = auto

# HDR output: auto (real HDR when SteamOS has HDR enabled) or off (always
# tone-map to SDR).
hdr = auto

# Switch the Steam Deck screen's refresh rate to a multiple of the video's
# frame rate (e.g. 48 or 72 Hz for 24 fps films) to remove judder.
# auto or off. Only works in game mode, on screens gamescope can retune
# (Steam Deck LCD/OLED). On VRR displays it is not needed.
refresh_match = auto
# Allowed rates: auto (what gamescope reports for the screen), a range like
# 40-60 or a list like 48,50,60,72,90.
refresh_rates = auto
# low = lowest matching rate (saves battery), high = highest (smoother menus).
refresh_prefer = low

# Experimental: resample audio slightly so video frames line up exactly with
# the (matched) refresh rate. Removes the occasional repeated frame.
display_resample = no

# mpv GPU context: auto (x11vk under gamescope so HDR works), or any mpv
# --gpu-context value such as waylandvk.
gpu_context = auto


[plex]
# Plex servers are added with Menu → "Sign in to Plex…" in the library.
# The app only uses encrypted (https) connections. If your router blocks
# Plex's "*.plex.direct" addresses (DNS rebinding protection) and Plex
# doesn't work at home, yes allows plain http on your home network.
# Only safe on a network you trust: the Plex token is then sent unencrypted.
allow_insecure_lan = no

[opensubtitles]
# "Download subtitles…" in the subtitle menu (X) searches OpenSubtitles.com
# in your subtitle_languages (English if empty). The entry only appears once
# you set your own personal API key here. To get one (free, 2 minutes):
#   1. Create an account at https://www.opensubtitles.com
#   2. Open https://www.opensubtitles.com/consumers, click "New consumer",
#      give it a name (e.g. "DeckVideoPlayer") and copy the API key.
# Keep the key private: don't share it or commit it anywhere.
api_key =

# Optional free account: without it OpenSubtitles allows only a few
# downloads per day. Use your username, not your e-mail address.
username =
password =

[interface]
# Scale of the whole interface (1.0 = designed for the Deck's 1280x800).
ui_scale = 1.0
# Turn "The.Movie.2019.1080p.mkv" into "The Movie 2019 1080p".
clean_names = yes
# Initial sort order in folders: name or date.
sort = name
# Seconds before the playback controls hide.
overlay_timeout = 4
# Number of recently played videos listed on the start screen (0 = none).
recently_played = 5
# Accent color (RRGGBB).
accent_color = 1A9FFF
