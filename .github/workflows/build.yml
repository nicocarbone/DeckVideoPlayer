name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job may write (D39). Third-party
# actions are pinned to commit SHAs so a moved tag can't change what builds
# and publishes the bundle; update them deliberately.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y mpv
      - run: tests/run.sh

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image's runtimes sit in its read-only lower layer and can be
      # weeks older than Flathub's. Updating them in place fails on some
      # runners with "Invalid cross-device link" (overlayfs can't rename
      # those folders), so the build works on a copy of the installation in
      # the job's own folder (D83).
      - name: Flatpak installation outside the image
        run: |
          cp -a /var/lib/flatpak "$RUNNER_TEMP/flatpak"
          echo "FLATPAK_SYSTEM_DIR=$RUNNER_TEMP/flatpak" >> "$GITHUB_ENV"
      # The action comes from flatpak/flatpak-github-actions again: the
      # flathub-infra fork was archived in 2025 and only keeps the images.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: DeckVideoPlayer.flatpak
          manifest-path: packaging/flatpak/io.github.nicocarbone.DeckVideoPlayer.yml
          # Same branch as scripts/build-flatpak.sh: bundles from different
          # branches install side by side and `flatpak run` keeps the old one.
          branch: stable
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Package installer
        run: |
          mkdir -p dist DeckVideoPlayer/dist DeckVideoPlayer/packaging
          find artifacts -name '*.flatpak' -exec cp {} dist/DeckVideoPlayer.flatpak \;
          cp dist/DeckVideoPlayer.flatpak DeckVideoPlayer/dist/
          cp -r scripts DeckVideoPlayer/
          cp -r packaging/steam DeckVideoPlayer/packaging/
          cp README.md CHANGELOG.md DeckVideoPlayer/
          tar czf DeckVideoPlayer-${GITHUB_REF_NAME}.tar.gz DeckVideoPlayer
      # GPL: publish the complete corresponding source of the bundle (D36).
      - name: Corresponding source archive
        run: |
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
          scripts/make-source-archive.py DeckVideoPlayer-${GITHUB_REF_NAME}-sources.tar.gz
      # The release text is the tag's CHANGELOG.md section (fails if missing).
      - name: Release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: release-notes.md
          files: |
            DeckVideoPlayer-*.tar.gz
            dist/DeckVideoPlayer.flatpak
