name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job may write (D39). Third-party
# actions are pinned to commit SHAs so a moved tag can't change what builds
# and publishes the bundle; update them deliberately.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y mpv
      - run: tests/run.sh

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40 # master 2026-10
        with:
          bundle: DeckVideoPlayer.flatpak
          manifest-path: packaging/flatpak/io.github.nicocarbone.DeckVideoPlayer.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Package installer
        run: |
          mkdir -p dist DeckVideoPlayer/dist DeckVideoPlayer/packaging
          find artifacts -name '*.flatpak' -exec cp {} dist/DeckVideoPlayer.flatpak \;
          cp dist/DeckVideoPlayer.flatpak DeckVideoPlayer/dist/
          cp -r scripts DeckVideoPlayer/
          cp -r packaging/steam DeckVideoPlayer/packaging/
          cp README.md CHANGELOG.md DeckVideoPlayer/
          tar czf DeckVideoPlayer-${GITHUB_REF_NAME}.tar.gz DeckVideoPlayer
      # GPL: publish the complete corresponding source of the bundle (D36).
      - name: Corresponding source archive
        run: |
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
          scripts/make-source-archive.py DeckVideoPlayer-${GITHUB_REF_NAME}-sources.tar.gz
      # The release text is the tag's CHANGELOG.md section (fails if missing).
      - name: Release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-notes.md
          files: |
            DeckVideoPlayer-*.tar.gz
            dist/DeckVideoPlayer.flatpak
